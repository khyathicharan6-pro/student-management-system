services:
  - type: web
    name: student-management-system
    runtime: java
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/student-management-system-0.0.1-SNAPSHOT.jar"
    healthCheckPath: /login
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: require
      - key: SPRING_PROFILE
        value: postgres
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx400m -Xss512k"
