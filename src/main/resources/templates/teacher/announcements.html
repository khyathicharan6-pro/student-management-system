<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Announcements')}"></head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

<div id="sms-content">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="p-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h3 class="fw-bold text-light mb-1">Institutional Announcements</h3>
                <p class="text-secondary small mb-0">Publish official notices, examination instructions, and class broadcasts.</p>
            </div>
            <div>
                <button type="button" class="btn btn-sms-primary d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#addAnnouncementModal">
                    <i class="bi bi-megaphone-fill"></i> New Announcement
                </button>
            </div>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small py-2 px-3 mb-4" role="alert" style="background-color: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); color: #6EE7B7;">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}">Success</span>
            <button type="button" class="btn-close btn-close-white small" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small py-2 px-3 mb-4" role="alert" style="background-color: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #FCA5A5;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">Error</span>
            <button type="button" class="btn-close btn-close-white small" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Announcements Feed -->
        <div class="row g-3">
            <div th:if="${#lists.isEmpty(announcements)}" class="col-12 text-center py-5 text-secondary">
                <i class="bi bi-bell-slash fs-1 d-block mb-2"></i>
                No active announcements published.
            </div>

            <div th:each="a : ${announcements}" class="col-12">
                <div class="sms-card p-4">
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <span class="badge bg-primary-subtle text-primary border small" th:text="${a.targetRole}">ALL</span>
                                <span th:if="${a.targetClassId != null}" class="badge bg-secondary-subtle text-secondary border small">Targeted Class</span>
                                <span class="text-secondary small" th:text="${#temporals.format(a.publishDate, 'dd MMM yyyy, hh:mm a')}">Date</span>
                            </div>
                            <h5 class="fw-bold text-light mb-2" th:text="${a.title}">Announcement Title</h5>
                            <p class="text-secondary mb-0" th:text="${a.content}">Announcement Content Body</p>
                        </div>
                        <div>
                            <form th:action="@{/teacher/announcements/delete}" method="post" onsubmit="return confirm('Delete this announcement?')">
                                <input type="hidden" name="id" th:value="${a.id}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<!-- Add Announcement Modal -->
<div class="modal fade" id="addAnnouncementModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background-color: #1E293B; border: 1px solid #334155; color: #F8FAFC;">
            <div class="modal-header" style="border-bottom: 1px solid #334155;">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-megaphone text-primary me-2"></i> Broadcast Announcement
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/teacher/announcements/add}" method="post" th:object="${newAnnouncement}">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Title *</label>
                        <input type="text" class="form-control sms-input" th:field="*{title}" placeholder="e.g. Schedule Revision for Midterm Exam" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Target Audience *</label>
                        <select class="form-select sms-input" th:field="*{targetRole}" required>
                            <option value="ALL">Entire College (All Students & Faculty)</option>
                            <option value="STUDENT">Students Only</option>
                            <option value="TEACHER">Faculty Only</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Target Specific Class (Optional)</label>
                        <select class="form-select sms-input" th:field="*{targetClassId}">
                            <option value="">All Classes (College Wide)</option>
                            <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name} + ' (Sec ' + ${c.section} + ')'"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Content Message *</label>
                        <textarea class="form-control sms-input" th:field="*{content}" rows="4" placeholder="Enter full announcement details..." required></textarea>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid #334155;">
                    <button type="button" class="btn btn-sms-outline" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sms-primary">Publish Announcement</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
