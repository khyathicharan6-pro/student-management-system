<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Class & Section Management')}"></head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

<div id="sms-content">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="p-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h3 class="fw-bold text-light mb-1">Class & Section Management</h3>
                <p class="text-secondary small mb-0">Configure student class cohorts, sections, semester links, and seat capacities.</p>
            </div>
            <div>
                <button type="button" class="btn btn-sms-primary d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#addClassModal">
                    <i class="bi bi-plus-circle-fill"></i> Create New Class
                </button>
            </div>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small py-2 px-3 mb-4" role="alert" style="background-color: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); color: #6EE7B7;">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}">Success</span>
            <button type="button" class="btn-close btn-close-white small" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small py-2 px-3 mb-4" role="alert" style="background-color: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #FCA5A5;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">Error</span>
            <button type="button" class="btn-close btn-close-white small" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Classes List Card -->
        <div class="sms-card">
            <div class="sms-card-header">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-building text-primary"></i>
                    <span>College Class Cohorts</span>
                </div>
                <span class="badge bg-primary-subtle text-primary border small" th:text="${classes.size()} + ' Total Classes'">0</span>
            </div>
            <div class="sms-card-body p-0">
                <div class="table-responsive">
                    <table class="table sms-table mb-0">
                        <thead>
                            <tr>
                                <th>Class Name</th>
                                <th>Section</th>
                                <th>Department</th>
                                <th>Capacity</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(classes)}">
                                <td colspan="5" class="text-center py-4 text-secondary">
                                    No classes configured yet.
                                </td>
                            </tr>
                            <tr th:each="c : ${classes}">
                                <td class="fw-bold text-light" th:text="${c.name}">Class Name</td>
                                <td><span class="badge bg-dark border text-light px-2" th:text="'Section ' + ${c.section}">Section A</span></td>
                                <td class="text-secondary small" th:text="${c.departmentId}">Dept ID</td>
                                <td><span class="badge bg-primary-subtle text-primary" th:text="${c.capacity} + ' Seats'">60 Seats</span></td>
                                <td>
                                    <a th:href="@{/teacher/students(classId=${c.id})}" class="btn btn-sm btn-sms-outline py-1 px-2">
                                        <i class="bi bi-people me-1"></i> View Roster
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<!-- Add Class Modal -->
<div class="modal fade" id="addClassModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background-color: #1E293B; border: 1px solid #334155; color: #F8FAFC;">
            <div class="modal-header" style="border-bottom: 1px solid #334155;">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-building text-primary me-2"></i> Create Class Cohort
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/teacher/classes/add}" method="post" th:object="${newClass}">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Class Name *</label>
                        <input type="text" class="form-control sms-input" th:field="*{name}" placeholder="e.g. CSE 5th Sem - Section A" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Department *</label>
                        <select class="form-select sms-input" th:field="*{departmentId}" required>
                            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                        </select>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label text-secondary small fw-semibold">Academic Year *</label>
                            <select class="form-select sms-input" th:field="*{academicYearId}" required>
                                <option th:each="ay : ${academicYears}" th:value="${ay.id}" th:text="${ay.name}"></option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-secondary small fw-semibold">Semester *</label>
                            <select class="form-select sms-input" th:field="*{semesterId}" required>
                                <option th:each="s : ${semesters}" th:value="${s.id}" th:text="${s.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label text-secondary small fw-semibold">Section Identifier *</label>
                            <input type="text" class="form-control sms-input" th:field="*{section}" placeholder="e.g. A" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-secondary small fw-semibold">Seat Capacity *</label>
                            <input type="number" class="form-control sms-input" th:field="*{capacity}" value="60" min="1" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid #334155;">
                    <button type="button" class="btn btn-sms-outline" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-sms-primary">Save Class</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
