<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="sms-navbar">
    <div class="d-flex align-items-center gap-3">
        <button id="sidebar-toggle" class="btn btn-sms-outline d-lg-none" type="button" aria-label="Toggle Navigation">
            <i class="bi bi-list fs-5"></i>
        </button>
        <span class="d-none d-md-inline text-secondary small">
            <i class="bi bi-mortarboard-fill text-primary me-1"></i>
            Springfield Institute of Technology
        </span>
    </div>

    <div class="d-flex align-items-center gap-3">
        <!-- Current Role Badge -->
        <span sec:authorize="hasRole('TEACHER')" class="badge-role">
            <i class="bi bi-person-workspace me-1"></i> Faculty Portal
        </span>
        <span sec:authorize="hasRole('STUDENT')" class="badge-role" style="background-color: rgba(16, 185, 129, 0.15); color: #34D399; border-color: rgba(16, 185, 129, 0.3);">
            <i class="bi bi-mortarboard me-1"></i> Student Portal
        </span>
        <span sec:authorize="hasRole('ADMIN')" class="badge-role" style="background-color: rgba(245, 158, 11, 0.15); color: #FBBF24; border-color: rgba(245, 158, 11, 0.3);">
            <i class="bi bi-shield-check me-1"></i> Admin
        </span>

        <!-- User Dropdown -->
        <div class="dropdown">
            <button class="btn btn-sms-outline dropdown-toggle d-flex align-items-center gap-2 py-1 px-2" type="button" id="userMenu" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; font-weight: 700; font-size: 0.85rem;">
                    <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                </div>
                <span class="small fw-semibold d-none d-sm-inline" th:text="${userDetails != null ? userDetails.displayName : #authentication.name}">User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow" style="background-color: #1E293B; border: 1px solid #334155;" aria-labelledby="userMenu">
                <li>
                    <h6 class="dropdown-header text-secondary small" th:text="'Signed in as ' + ${#authentication.name}">Account</h6>
                </li>
                <li><hr class="dropdown-divider" style="border-color: #334155;"></li>
                <li sec:authorize="hasRole('TEACHER')">
                    <a class="dropdown-item text-light small py-2" th:href="@{/teacher/profile}">
                        <i class="bi bi-person me-2 text-primary"></i> Faculty Profile
                    </a>
                </li>
                <li sec:authorize="hasRole('STUDENT')">
                    <a class="dropdown-item text-light small py-2" th:href="@{/student/profile}">
                        <i class="bi bi-person me-2 text-success"></i> My Profile
                    </a>
                </li>
                <li><hr class="dropdown-divider" style="border-color: #334155;"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="px-2 py-1">
                        <button type="submit" class="btn btn-sm btn-danger w-100 d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-box-arrow-right"></i> Sign Out
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
