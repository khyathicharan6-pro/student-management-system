<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('403 - Access Forbidden')}"></head>
<body class="bg-dark">
<div class="login-wrapper">
    <div class="login-card text-center">
        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="background-color: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);">
            <i class="bi bi-shield-x text-danger fs-1"></i>
        </div>
        <h2 class="fw-bold text-light mb-1">403 Forbidden</h2>
        <h5 class="text-danger mb-3">Unauthorized Academic Operation</h5>
        <p class="text-secondary small mb-4">
            You do not have institutional authorization or ownership permissions to access or modify this resource. Academic integrity rules strictly prohibit unauthorized modifications.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-sms-primary">
                <i class="bi bi-arrow-left me-1"></i> Return to Safe Dashboard
            </a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
