<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('500 - Internal Error')}"></head>
<body class="bg-dark">
<div class="login-wrapper">
    <div class="login-card text-center">
        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3" style="background-color: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);">
            <i class="bi bi-cpu text-danger fs-1"></i>
        </div>
        <h2 class="fw-bold text-light mb-1">500 Server Error</h2>
        <h5 class="text-danger mb-3">Unexpected System Exception</h5>
        <p class="text-secondary small mb-4">
            An internal server error occurred while processing your academic request. The incident has been recorded in the security audit logs.
        </p>
        <a th:href="@{/}" class="btn btn-sms-primary">
            <i class="bi bi-arrow-left me-1"></i> Return to Portal
        </a>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
